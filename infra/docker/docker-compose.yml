# contract-payment-flow — local dev orchestration
#
# ⚠ DELIBERATE BROWNFIELD DEBT (cross-references docs/brownfield-debt.md):
#   - postgres data volume NOT mounted (data lost on restart) — Item 11 reinforcement
#   - no healthchecks on any service — Item 11 reinforcement
#   - service images use :latest (Item 11)
#
# Bring up the full stack:
#   docker-compose -f infra/docker/docker-compose.yml up --build
#
# Endpoints once up:
#   http://localhost:8080         — api-gateway
#   http://localhost:8081         — contract-modification-service (direct)
#   http://localhost:8082         — invoice-review-service (direct)
#   ai-orchestrator               — NOT host-published (security review finding 1);
#                                   reach it via the gateway at /api/ai/**
#   http://localhost:4200         — Angular SPA
#   localhost:5432                — postgres
#   localhost:27017               — mongodb

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: contract_payment_flow
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    ports:
      - "5432:5432"
    # ⚠ DELIBERATE: no volume mount. Restart = data loss.
    # Cohort fixes in W1 Tue inventory follow-up.

  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    # Stable hostname: atlas-local pins the single-node replica-set member to
    # the container hostname at first init. Without this, any `up --build`
    # recreate changes the hostname, the old member host no longer resolves,
    # no primary is elected, and the atlas-local runner panics (exit 2).
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: app
      MONGODB_INITDB_ROOT_PASSWORD: app_dev_password
      DO_NOT_TRACK: "1"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db       # ← inconsistency vs postgres — teaching moment
      - mongo-configdb:/data/configdb  # keyfile lives here; must persist across restarts
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: ../../services/api-gateway
    image: contract-payment-flow/api-gateway:latest   # ⚠ Item 11
    ports:
      - "8080:8080"
    environment:
      JWT_ISSUER_URI: http://localhost:8090/auth
      CONTRACT_MODIFICATION_SERVICE_URL: http://contract-modification-service:8081
      INVOICE_REVIEW_SERVICE_URL: http://invoice-review-service:8082
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:8000
    depends_on:
      - contract-modification-service
      - invoice-review-service
      - ai-orchestrator
    # ⚠ no healthcheck

  contract-modification-service:
    build:
      context: ../../services/contract-modification-service
    image: contract-payment-flow/contract-modification-service:latest   # ⚠ Item 11
    ports:
      - "8081:8081"
    environment:
      MONGO_URL: mongodb://app:app_dev_password@mongodb:27017
      MONGO_DB: contract_payment_flow
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:8000
      JWT_ISSUER_URI: http://localhost:8090/auth
    depends_on:
      - mongodb
      - ai-orchestrator
    # ⚠ no healthcheck

  invoice-review-service:
    build:
      context: ../../services/invoice-review-service
    image: contract-payment-flow/invoice-review-service:latest   # ⚠ Item 11
    ports:
      - "8082:8082"
    environment:
      CONTRACT_MODIFICATION_SERVICE_URL: http://contract-modification-service:8081
      # ⚠ DELIBERATE: invoice-review-service calls contract-modification-service directly,
      #   not through the gateway — tighter coupling than necessary, and the
      #   call has no circuit breaker (Item 3).
    depends_on:
      - contract-modification-service
    # ⚠ no healthcheck

  ai-orchestrator:
    build:
      context: ../../services/ai-orchestrator
    image: contract-payment-flow/ai-orchestrator:latest   # ⚠ Item 11
    # Security review finding 1: NOT host-published. The corpus-write auth
    # (app/ingestion/auth.py) trusts gateway-asserted X-User-* headers, which is
    # only safe while port 8000 is unreachable from the host. `expose` keeps it
    # on the compose-internal network — reachable by the api-gateway and sibling
    # services, never by an outside caller who could spoof X-User-Role. Route
    # external traffic through the gateway: /api/ai/** → ai-orchestrator.
    expose:
      - "8000"
    environment:
      AWS_REGION: us-east-1
      BEDROCK_MODEL_ID: anthropic.claude-3-7-sonnet-20250219-v1:0
      MONGO_URL: mongodb://app:app_dev_password@mongodb:27017
      # Bedrock bearer-token auth (ADR-0005 §4 / Migration Step 4). Interpolated
      # from the repo-root .env — bring the stack up with:
      #   docker-compose -f infra/docker/docker-compose.yml --env-file ../../.env up
      # (or `--env-file .env` from repo root). Empty string if unset, so the
      # mock-Bedrock path still works without real creds.
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
    volumes:
      - ../../data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
    # ⚠ DELIBERATE: no AWS access-key creds wired — relies on shared dev IAM role
    #   mounted via ~/.aws/credentials, OR the bearer token above. The Bedrock
    #   stub returns mock data so it works without real creds. First-day learners
    #   discover this and learn to run `aws configure sso`.
    # ⚠ no healthcheck

  frontend:
    build:
      context: ../../frontend
    image: contract-payment-flow/frontend:latest   # ⚠ Item 11
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    # ⚠ no healthcheck

volumes:
  mongo-data:
  mongo-configdb:
